; Redirect errors to stderr
error_log = "/dev/stderr"

; Make sure _ENV is populated to use it in wp-config.php
variables_order = "EGPCS"

; Hide PHP version info in response headers
expose_php = Off

; Up the upload limit
post_max_size = 50M
upload_max_filesize = 50M

; Avoid silently truncated saves for large menus, variations, and field groups
max_input_vars = 3000

; memory limit
memory_limit = 192M

[Date]
; Set default timezone, you can configure the timezone in Wordpress
date.timezone = "America/New_York"

opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.revalidate_freq=60

apc.shm_size=64M

; Keep web requests from holding a PHP-FPM worker for several minutes.
max_execution_time = 60

session.cookie_httponly = 1
session.use_strict_mode = 1
